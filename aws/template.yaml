AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nigeyo training and live regional notifications for opted-in devices.

Parameters:
  WorkerImage:
    Type: String
    Description: ECR image URI pinned to a digest.
    Default: ''
    AllowedPattern: '^(|.+@sha256:[0-9a-f]{64})$'
  LiveSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^(|arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+)$'
  VpcId:
    Type: String
    Default: ''
    AllowedPattern: '^(|vpc-([0-9a-f]{8}|[0-9a-f]{17}))$'
  PublicSubnet:
    Type: String
    Default: ''
    AllowedPattern: '^(|subnet-([0-9a-f]{8}|[0-9a-f]{17}))$'
    Description: Subnet in the VPC with an Internet Gateway route.
  LiveEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  AppRegistrationEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  SelfRegistrationEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  AndroidDeliveryEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  OperationsSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^(|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+)$'
  OperationsAlarmTopicArn:
    Type: String
    Default: ''
    AllowedPattern: '^(|arn:[a-z-]+:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+)$'
  APNsSecretArn:
    Type: String
    Description: Full ARN of the existing Secrets Manager secret in this account and region.
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  OperatorRoleName:
    Type: String
    Description: Name of the existing IAM role used by the demo operator.
    AllowedPattern: '^[a-zA-Z0-9_+=,.@-]{1,64}$'

Rules:
  RequireAndroidRegistration:
    RuleCondition: !Equals [!Ref AndroidDeliveryEnabled, 'true']
    Assertions:
      - Assert: !Equals [!Ref SelfRegistrationEnabled, 'true']
        AssertDescription: Enable SelfRegistrationEnabled before enabling Android delivery.
  RequireRegistrationApi:
    RuleCondition: !Equals [!Ref SelfRegistrationEnabled, 'true']
    Assertions:
      - Assert: !Equals [!Ref AppRegistrationEnabled, 'true']
        AssertDescription: Enable AppRegistrationEnabled before enabling self registration.
  RequireLiveParameters:
    RuleCondition: !Or
      - !Equals [!Ref LiveEnabled, 'true']
      - !Not [!Equals [!Ref WorkerImage, '']]
      - !Equals [!Ref AppRegistrationEnabled, 'true']
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref WorkerImage, '']]
          - !Not [!Equals [!Ref LiveSecretArn, '']]
          - !Not [!Equals [!Ref VpcId, '']]
          - !Not [!Equals [!Ref PublicSubnet, '']]
        AssertDescription: Set WorkerImage, LiveSecretArn, VpcId and PublicSubnet to configure live monitoring.

Conditions:
  ConfigureLiveMonitoring: !Not [!Equals [!Ref WorkerImage, '']]
  EnableLiveMonitoring: !Equals [!Ref LiveEnabled, 'true']

  ConfigureAppRegistration: !And
    - !Condition ConfigureLiveMonitoring
    - !Equals [!Ref AppRegistrationEnabled, 'true']

  SendOperationsAlarms: !Not [!Equals [!Ref OperationsAlarmTopicArn, '']]
  ConfigureSelfRegistration: !And
    - !Condition ConfigureAppRegistration
    - !Equals [!Ref SelfRegistrationEnabled, 'true']

  ConfigureOperations: !And
    - !Condition ConfigureSelfRegistration
    - !Not [!Equals [!Ref OperationsSecretArn, '']]

  ConfigureAndroidDelivery: !And
    - !Condition ConfigureSelfRegistration
    - !Equals [!Ref AndroidDeliveryEnabled, 'true']

Resources:
  Installations:
    Condition: ConfigureSelfRegistration
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      AttributeDefinitions:
        - {AttributeName: kind, AttributeType: S}
        - {AttributeName: id, AttributeType: S}
      KeySchema:
        - {AttributeName: kind, KeyType: HASH}
        - {AttributeName: id, KeyType: RANGE}
  LiveRegistrationApi:
    Condition: ConfigureAppRegistration
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: !If [ConfigureSelfRegistration, 30, 5]
        ThrottlingRateLimit: !If [ConfigureSelfRegistration, 15, 2]
  LiveRegistration:
    Condition: ConfigureAppRegistration
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ..
      Handler: aws/live-registration.handler
      Runtime: nodejs24.x
      Timeout: 8
      Environment:
        Variables:
          APNS_SECRET_ARN: !Ref LiveSecretArn
          ANDROID_DELIVERY_ENABLED: !Ref AndroidDeliveryEnabled
          STATE_BUCKET: !Ref RegionalState
          INSTALLATION_TABLE: !If [ConfigureSelfRegistration, !Ref Installations, '']
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref LiveSecretArn
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub '${RegionalState.Arn}/live-subscription.json'
                - !Sub '${RegionalState.Arn}/subscriptions/*'
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub '${RegionalState.Arn}/activity-updates/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt RegionalState.Arn
        - !If
          - ConfigureSelfRegistration
          - Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt Installations.Arn
          - !Ref AWS::NoValue
      Events:
        Enroll:
          Type: HttpApi
          Properties:
            ApiId: !Ref LiveRegistrationApi
            Path: /v2/installations
            Method: PUT
        RemoveInstallation:
          Type: HttpApi
          Properties:
            ApiId: !Ref LiveRegistrationApi
            Path: /v2/installations
            Method: DELETE
        UpdateSubscription:
          Type: HttpApi
          Properties:
            ApiId: !Ref LiveRegistrationApi
            Path: /v2/subscription
            Method: PUT
        UpdateActivity:
          Type: HttpApi
          Properties:
            ApiId: !Ref LiveRegistrationApi
            Path: /v2/activity
            Method: PUT
        PollAndroidAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref LiveRegistrationApi
            Path: /v2/alerts
            Method: GET
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref LiveRegistrationApi
            Path: /subscription
            Method: PUT
        Activity:
          Type: HttpApi
          Properties:
            ApiId: !Ref LiveRegistrationApi
            Path: /activity
            Method: PUT

  TrainingPush:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ..
      Handler: aws/live-registration.trainingHandler
      Runtime: nodejs24.x
      Timeout: 12
      Environment:
        Variables:
          APNS_SECRET_ARN: !If [ConfigureAppRegistration, !Ref LiveSecretArn, !Ref APNsSecretArn]
          ANDROID_DELIVERY_ENABLED: !Ref AndroidDeliveryEnabled
          STATE_BUCKET: !If [ConfigureAppRegistration, !Ref RegionalState, '']
          INSTALLATION_TABLE: !If [ConfigureSelfRegistration, !Ref Installations, '']
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !If [ConfigureAppRegistration, !Ref LiveSecretArn, !Ref APNsSecretArn]
        - !If
          - ConfigureAppRegistration
          - Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${RegionalState.Arn}/live-subscription.json'
                  - !Sub '${RegionalState.Arn}/subscriptions/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RegionalState.Arn
          - !Ref AWS::NoValue

        - !If
          - ConfigureSelfRegistration
          - Statement:
              - Effect: Allow
                Action: !If [ConfigureAndroidDelivery, [dynamodb:GetItem, dynamodb:PutItem], dynamodb:GetItem]
                Resource: !GetAtt Installations.Arn
          - !Ref AWS::NoValue

  Operations:
    Condition: ConfigureOperations
    Type: AWS::Serverless::Function
    Metadata: {BuildMethod: makefile}
    Properties:
      CodeUri: ..
      Handler: aws/live-registration.operationsHandler
      Runtime: nodejs24.x
      Timeout: 15
      Environment:
        Variables:
          APNS_SECRET_ARN: !Ref LiveSecretArn
          ANDROID_DELIVERY_ENABLED: !Ref AndroidDeliveryEnabled
          INSTALLATION_TABLE: !Ref Installations
          OPS_SECRET_ARN: !Ref OperationsSecretArn
          OPS_ALLOW_SHORT_KEY: !If [EnableLiveMonitoring, 'false', 'true']
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref OperationsSecretArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref LiveSecretArn
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem]
              Resource: !GetAtt Installations.Arn
      Events:
        Dashboard:
          Type: HttpApi
          Properties: {ApiId: !Ref LiveRegistrationApi, Path: /ops, Method: GET}
        Assets:
          Type: HttpApi
          Properties: {ApiId: !Ref LiveRegistrationApi, Path: '/ops/{asset}', Method: GET}
        Status:
          Type: HttpApi
          Properties: {ApiId: !Ref LiveRegistrationApi, Path: /ops/api/status, Method: GET}
        Drills:
          Type: HttpApi
          Properties: {ApiId: !Ref LiveRegistrationApi, Path: /ops/api/drills, Method: POST}

  OperatorInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-invoke-training-push'
      Roles:
        - !Ref OperatorRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt TrainingPush.Arn

  Cluster:
    Condition: ConfigureLiveMonitoring
    Type: AWS::ECS::Cluster
  WorkerSecurityGroup:
    Condition: ConfigureLiveMonitoring
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Regional worker outbound connections only
      VpcId: !Ref VpcId
  RegionalState:
    Condition: ConfigureLiveMonitoring
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireActivityUpdateTokens
            Prefix: activity-updates/
            Status: Enabled
            ExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  WorkerLogs:
    Condition: ConfigureLiveMonitoring
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  ExecutionRole:
    Condition: ConfigureLiveMonitoring
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  WorkerRole:
    Condition: ConfigureLiveMonitoring
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref LiveSecretArn
              # GetObject returns NoSuchKey on first boot only with ListBucket permission.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RegionalState.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${RegionalState.Arn}/regional-monitor.json'
              - !If
                - ConfigureAppRegistration
                - Effect: Allow
                  Action: s3:GetObject
                  Resource:
                    - !Sub '${RegionalState.Arn}/live-subscription.json'
                    - !Sub '${RegionalState.Arn}/subscriptions/*'
                    - !Sub '${RegionalState.Arn}/activity-updates/*'
                - !Ref AWS::NoValue
              - !If
                - ConfigureSelfRegistration
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem]
                  Resource: !GetAtt Installations.Arn
                - !Ref AWS::NoValue
  WorkerTask:
    Condition: ConfigureLiveMonitoring
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerRole.Arn
      ContainerDefinitions:
        - Name: regional-worker
          Image: !Ref WorkerImage
          Essential: true
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          HealthCheck:
            Command:
              - CMD
              - node
              - -e
              - >-
                fetch('http://127.0.0.1:8080', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))
            StartPeriod: 30
            Interval: 30
            Timeout: 5
            Retries: 3
          Environment:
            - {Name: APNS_SECRET_ARN, Value: !Ref LiveSecretArn}
            - {Name: ANDROID_DELIVERY_ENABLED, Value: !Ref AndroidDeliveryEnabled}
            - {Name: STATE_BUCKET, Value: !Ref RegionalState}
            - {Name: STACK_NAME, Value: !Ref 'AWS::StackName'}
            - Name: INSTALLATION_TABLE
              Value: !If [ConfigureSelfRegistration, !Ref Installations, '']
            - Name: APP_REGISTRATION_ENABLED
              Value: !If [ConfigureAppRegistration, 'true', 'false']
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: regional-worker
  WorkerService:
    Condition: ConfigureLiveMonitoring
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTask
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !If [EnableLiveMonitoring, 1, 0]
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref WorkerSecurityGroup]
          Subnets: [!Ref PublicSubnet]

  WorkerMissing:
    Condition: ConfigureLiveMonitoring
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Worker heartbeat missing for three minutes.
      Namespace: Nigeyo/Worker
      MetricName: WorkerHeartbeat
      Dimensions: [{Name: Environment, Value: !Ref 'AWS::StackName'}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: !If [EnableLiveMonitoring, breaching, notBreaching]
      ActionsEnabled: !If [EnableLiveMonitoring, true, false]
      AlarmActions: !If [SendOperationsAlarms, [!Ref OperationsAlarmTopicArn], !Ref 'AWS::NoValue']
  FeedUnavailable:
    Condition: ConfigureLiveMonitoring
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Feed down, delivery failures or stale pending alerts.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 3
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      ActionsEnabled: !If [EnableLiveMonitoring, true, false]
      AlarmActions: !If [SendOperationsAlarms, [!Ref OperationsAlarmTopicArn], !Ref 'AWS::NoValue']
      Metrics:
        - Id: health
          Expression: IF(feed >= 1 OR pending >= 30 OR failures >= 5 OR signing >= 1, 1, 0)
          ReturnData: true
        - Id: feed
          ReturnData: false
          MetricStat:
            Metric: {Namespace: Nigeyo/Worker, MetricName: FeedDown, Dimensions: [{Name: Environment, Value: !Ref 'AWS::StackName'}]}
            Period: 60
            Stat: Maximum
        - Id: pending
          ReturnData: false
          MetricStat:
            Metric: {Namespace: Nigeyo/Worker, MetricName: OldestPendingSeconds, Dimensions: [{Name: Environment, Value: !Ref 'AWS::StackName'}]}
            Period: 60
            Stat: Maximum
        - Id: failures
          ReturnData: false
          MetricStat:
            Metric: {Namespace: Nigeyo/Worker, MetricName: DeliveryFailures, Dimensions: [{Name: Environment, Value: !Ref 'AWS::StackName'}]}
            Period: 60
            Stat: Sum
        - Id: signing
          ReturnData: false
          MetricStat:
            Metric: {Namespace: Nigeyo/Worker, MetricName: SigningFailures, Dimensions: [{Name: Environment, Value: !Ref 'AWS::StackName'}]}
            Period: 60
            Stat: Sum

Outputs:
  OperationsUrl:
    Condition: ConfigureOperations
    Value: !Sub 'https://${LiveRegistrationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/ops'
  LiveRegistrationUrl:
    Condition: ConfigureAppRegistration
    Value: !If
      - ConfigureSelfRegistration
      - !Sub 'https://${LiveRegistrationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v2/subscription'
      - !Sub 'https://${LiveRegistrationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/subscription'
  InstallationTableName:
    Condition: ConfigureSelfRegistration
    Value: !Ref Installations
  ClusterName:
    Condition: ConfigureLiveMonitoring
    Value: !Ref Cluster
  ServiceName:
    Condition: ConfigureLiveMonitoring
    Value: !GetAtt WorkerService.Name
  TrainingPushFunctionName:
    Value: !Ref TrainingPush
